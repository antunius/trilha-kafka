<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">checkout-group pendurado na parti??o</title>
  <desc id="desc">
    O producer escreve no t?pico. A key escolhe a coluna. Cada membro do
    checkout-group fica pendurado em uma parti??o. Este recado cai na P1,
    ent?o s? o membro da P1 l?.
  </desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c45c26"/>
    </marker>
    <path id="path-write" d="M 450 84 V 268"/>
    <path id="path-read" d="M 450 292 V 488"/>
  </defs>

  <rect width="900" height="640" fill="#fffdf8"/>

  <text x="450" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c1915">Quem l? este recado?</text>
  <text x="450" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">a key escolhe a coluna ? o group.id escolhe a marca ? um membro por parti??o</text>

  <rect x="330" y="60" width="240" height="52" rx="8" fill="#fff" stroke="#c45c26" stroke-width="2"/>
  <text x="450" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">Producer ? checkout</text>
  <text x="450" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">PedidoCriado ? key 99</text>
  <path d="M450 112 V 136" stroke="#c45c26" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <text x="450" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">t?pico pedidos</text>
  <text x="450" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">tr?s colunas ? hash(99) % 3 = P1</text>

  <!-- P0 -->
  <rect x="28" y="188" width="268" height="250" rx="10" fill="#fff" stroke="#d9d0c2"/>
  <text x="162" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">P0</text>
  <text x="162" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.08em" fill="#8a8174">OUTRA COLUNA</text>
  <rect x="48" y="248" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="162" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">882 ? PedidoCriado 12</text>
  <rect x="48" y="288" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="162" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">883 ? PedidoCriado 45</text>
  <rect x="48" y="328" width="228" height="32" rx="4" fill="#f3e4d6" stroke="#c45c26"/>
  <text x="162" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c45c26">marca C0 ? parou no 883</text>
  <text x="162" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a8174">este recado n?o cai aqui</text>

  <!-- P1: a coluna do recado -->
  <rect x="316" y="188" width="268" height="250" rx="10" fill="#fff" stroke="#c45c26" stroke-width="2.5"/>
  <text x="450" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">P1</text>
  <text x="450" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.08em" fill="#c45c26">A COLUNA DO KEY 99</text>
  <rect x="336" y="248" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="450" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">1040 ? PedidoCriado 71</text>
  <rect x="336" y="288" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="450" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">1041 ? PedidoCriado 88</text>
  <rect x="336" y="328" width="228" height="32" rx="4" fill="#fffdf8" stroke="#c45c26" stroke-width="2">
    <animate attributeName="fill" dur="10s" repeatCount="indefinite" calcMode="discrete"
      values="#fffdf8;#fffdf8;#f3e4d6;#f3e4d6" keyTimes="0;0.28;0.4;1"/>
  </rect>
  <text x="450" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1915">1042 ? PedidoCriado 99</text>
  <rect x="336" y="372" width="228" height="28" rx="4" fill="#f3e4d6" stroke="#c45c26"/>
  <text x="450" y="391" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c45c26">marca C1 ? vai ler o 1042</text>

  <!-- P2 -->
  <rect x="604" y="188" width="268" height="250" rx="10" fill="#fff" stroke="#d9d0c2"/>
  <text x="738" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">P2</text>
  <text x="738" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.08em" fill="#8a8174">OUTRA COLUNA</text>
  <rect x="624" y="248" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="738" y="269" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">411 ? PedidoCriado 8</text>
  <rect x="624" y="288" width="228" height="32" rx="4" fill="#efe8dc"/>
  <text x="738" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">412 ? PedidoCriado 21</text>
  <rect x="624" y="328" width="228" height="32" rx="4" fill="#f3e4d6" stroke="#c45c26"/>
  <text x="738" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c45c26">marca C2 ? parou no 412</text>
  <text x="738" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a8174">este recado n?o cai aqui</text>

  <!-- fios: cada membro pendurado na sua coluna -->
  <line x1="162" y1="438" x2="162" y2="478" stroke="#d9d0c2" stroke-width="2.5"/>
  <line x1="450" y1="438" x2="450" y2="478" stroke="#c45c26" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="738" y1="438" x2="738" y2="478" stroke="#d9d0c2" stroke-width="2.5"/>

  <rect x="28" y="478" width="844" height="88" rx="10" fill="#f3e4d6" fill-opacity="0.55" stroke="#c45c26"/>
  <text x="450" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c45c26">checkout-group ? mesmo crach? ? tr?s m?os ? uma por coluna</text>

  <rect x="48" y="512" width="228" height="42" rx="8" fill="#fff" stroke="#d9d0c2"/>
  <text x="162" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">C0</text>
  <text x="162" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c564c">s? l? P0</text>

  <rect x="336" y="512" width="228" height="42" rx="8" fill="#fff" stroke="#c45c26" stroke-width="2.5"/>
  <text x="450" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">C1</text>
  <text x="450" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c45c26">pendurado na P1</text>

  <rect x="624" y="512" width="228" height="42" rx="8" fill="#fff" stroke="#d9d0c2"/>
  <text x="738" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">C2</text>
  <text x="738" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c564c">s? l? P2</text>

  <!-- pacote: cai na P1 -->
  <g>
    <g transform="translate(-44,-12)">
      <rect width="88" height="24" rx="4" fill="#c45c26"/>
      <text x="44" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fffdf8">key 99</text>
    </g>
    <animateMotion dur="2.4s" begin="0.6s; loop.end+0.6s" fill="freeze">
      <mpath href="#path-write"/>
    </animateMotion>
    <set attributeName="opacity" to="1" begin="0.6s; loop.end+0.6s"/>
    <set attributeName="opacity" to="0" begin="3.2s; loop.end+3.2s"/>
  </g>

  <!-- pacote: desce o fio da P1 at? C1 -->
  <g opacity="0">
    <g transform="translate(-44,-12)">
      <rect width="88" height="24" rx="4" fill="#c45c26"/>
      <text x="44" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fffdf8">offset 1042</text>
    </g>
    <animateMotion dur="2s" begin="4.2s; loop.end+4.2s" fill="freeze">
      <mpath href="#path-read"/>
    </animateMotion>
    <set attributeName="opacity" to="1" begin="4.2s; loop.end+4.2s"/>
    <set attributeName="opacity" to="0" begin="7.4s; loop.end+7.4s"/>
  </g>
  <animate id="loop" attributeName="opacity" from="1" to="1" dur="10s" begin="0s" repeatCount="indefinite"/>

  <rect x="28" y="580" width="844" height="44" rx="8" fill="#fff" stroke="#d9d0c2"/>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#1c1915">
    <text x="450" y="607" text-anchor="middle" opacity="0">
      checkout publica PedidoCriado 99. A key escolhe a coluna, n?o o grupo.
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
        values="1;0;0" keyTimes="0;0.28;1"/>
    </text>
    <text x="450" y="607" text-anchor="middle" opacity="0">
      O recado entra na P1. C0 e C2 nem veem: a marca deles est? em outra coluna.
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
        values="0;1;0;0" keyTimes="0;0.28;0.5;1"/>
    </text>
    <text x="450" y="607" text-anchor="middle" opacity="0">
      S? C1 l?: ? o ?nico membro de checkout-group pendurado na P1.
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
        values="0;1;0" keyTimes="0;0.5;1"/>
    </text>
  </g>
</svg>
