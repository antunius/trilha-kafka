<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img">
  <title>Tres particoes, grupo A com ocioso, grupo B lendo as tres</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c45c26"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b4f"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#fffdf8"/>
  <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1c1915">Tópico pedidos &#8212; 3 colunas</text>
  <text x="460" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">cada coluna é uma partição &#183; o caderno inteiro não tem ordem única</text>
  <line x1="160" y1="166" x2="160" y2="448" stroke="#2f6b4f" stroke-width="2" opacity="0.35"/>
  <line x1="390" y1="166" x2="390" y2="448" stroke="#2f6b4f" stroke-width="2" opacity="0.35"/>
  <line x1="620" y1="166" x2="620" y2="448" stroke="#2f6b4f" stroke-width="2" opacity="0.35"/>
  <g font-family="system-ui, sans-serif">
    <rect x="70" y="78" width="180" height="88" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="160" y="104" text-anchor="middle" font-size="11" letter-spacing="0.12em" fill="#c45c26">PARTIÇÃO</text>
    <text x="160" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1c1915">P0</text>
    <text x="160" y="150" text-anchor="middle" font-size="12" fill="#5c564c">líder &#183; ISR em dia</text>
    <rect x="300" y="78" width="180" height="88" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="390" y="104" text-anchor="middle" font-size="11" letter-spacing="0.12em" fill="#c45c26">PARTIÇÃO</text>
    <text x="390" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1c1915">P1</text>
    <text x="390" y="150" text-anchor="middle" font-size="12" fill="#5c564c">outra coluna</text>
    <rect x="530" y="78" width="180" height="88" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="620" y="104" text-anchor="middle" font-size="11" letter-spacing="0.12em" fill="#c45c26">PARTIÇÃO</text>
    <text x="620" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1c1915">P2</text>
    <text x="620" y="150" text-anchor="middle" font-size="12" fill="#5c564c">outra coluna</text>
  </g>
  <line x1="160" y1="166" x2="160" y2="228" stroke="#c45c26" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="390" y1="166" x2="390" y2="228" stroke="#c45c26" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="620" y1="166" x2="620" y2="228" stroke="#c45c26" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="48" y="214" width="680" height="150" rx="10" fill="#f3e4d6" fill-opacity="0.55" stroke="#c45c26"/>
  <text x="64" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c45c26">Grupo A &#183; faturamento &#183; um leitor por coluna</text>
  <g font-family="system-ui, sans-serif">
    <rect x="80" y="254" width="160" height="86" rx="8" fill="#fff" stroke="#c45c26"/>
    <text x="160" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">A1</text>
    <text x="160" y="308" text-anchor="middle" font-size="13" fill="#5c564c">só lê P0</text>
    <rect x="310" y="254" width="160" height="86" rx="8" fill="#fff" stroke="#c45c26"/>
    <text x="390" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">A2</text>
    <text x="390" y="308" text-anchor="middle" font-size="13" fill="#5c564c">só lê P1</text>
    <rect x="540" y="254" width="160" height="86" rx="8" fill="#fff" stroke="#c45c26"/>
    <text x="620" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">A3</text>
    <text x="620" y="308" text-anchor="middle" font-size="13" fill="#5c564c">só lê P2</text>
  </g>
  <rect x="748" y="78" width="148" height="286" rx="10" fill="#f6f1e8" stroke="#5c564c" stroke-dasharray="6 4"/>
  <text x="822" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5c564c">A4</text>
  <text x="822" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a4b12">ocioso</text>
  <text x="822" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">não existe</text>
  <text x="822" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">4ª coluna</text>
  <text x="822" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c564c">mesmo crachá,</text>
  <text x="822" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c564c">nada para ler</text>
  <rect x="48" y="390" width="848" height="148" rx="10" fill="#e4efe8" fill-opacity="0.7" stroke="#2f6b4f"/>
  <text x="64" y="414" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6b4f">Grupo B &#183; analytics &#183; outra marca no mesmo caderno</text>
  <line x1="160" y1="364" x2="160" y2="448" stroke="#2f6b4f" stroke-width="2.5" marker-end="url(#arrg)"/>
  <line x1="390" y1="364" x2="390" y2="448" stroke="#2f6b4f" stroke-width="2.5" marker-end="url(#arrg)"/>
  <line x1="620" y1="364" x2="620" y2="448" stroke="#2f6b4f" stroke-width="2.5" marker-end="url(#arrg)"/>
  <rect x="80" y="452" width="780" height="64" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="470" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1915">B1 &#8212; um processo lê P0, P1 e P2, em loop</text>
  <text x="470" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c564c">marcas independentes: A no 80 e B no 12 na mesma coluna</text>
</svg>
